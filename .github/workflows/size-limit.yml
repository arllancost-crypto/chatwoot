name: Run Size Limit Check

on:
  pull_request:
    branches:
      - develop
      - yara/dev-4.16.2

# If two pushes happen within a short time in the same PR, cancel the run of the oldest push
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install secure image processing library
        run: sudo apt-get update && sudo apt-get install -y libvips42

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: pnpm
        run: pnpm install

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: setup env
        run: |
          cp .env.example .env

      - name: Run asset compile
        run: bundle exec rake assets:precompile
        env:
          RAILS_ENV: production

      - name: Size Check
        run: pnpm run size
